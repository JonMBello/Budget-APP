name: Deploy budget-app
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: budget-app-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - name: Package standalone release
        run: |
          cp deploy/ecosystem.config.cjs .next/standalone/
          tar -czf "$RUNNER_TEMP/budget-app.tar.gz" -C .next/standalone .
      - name: Upload and activate
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          target="$SSH_USER@$SSH_HOST"
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          release_id="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          release="/var/www/budget.jonmb.com/app/releases/$release_id"
          ssh "${opts[@]}" -p "$SSH_PORT" "$target" "test \"\$(uname -m)\" = x86_64 && mkdir -p '$release'"
          scp "${opts[@]}" -P "$SSH_PORT" "$RUNNER_TEMP/budget-app.tar.gz" "$target:$release/release.tar.gz"
          ssh "${opts[@]}" -p "$SSH_PORT" "$target" "tar -xzf '$release/release.tar.gz' -C '$release'"
          ssh "${opts[@]}" -p "$SSH_PORT" "$target" "bash -s -- '$release_id'" < deploy/activate.sh
